name: Build & test ua-attestation-verifier

on:
  push:
    branches: ["main"]
    paths:
      - "packages/attestation-verifier/**"
      - ".github/workflows/attestation-verifier-build.yml"
  pull_request:
    paths:
      - "packages/attestation-verifier/**"
      - ".github/workflows/attestation-verifier-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run -w ua-attestation-verifier typecheck

      - name: Test
        run: npm run -w ua-attestation-verifier test

      - name: Build
        run: npm run -w ua-attestation-verifier build
