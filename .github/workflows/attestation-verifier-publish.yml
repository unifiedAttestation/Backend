name: Publish ua-attestation-verifier

on:
  push:
    tags:
      - "attestation-verifier-v*"

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Installs the whole workspace -- the package's dependencies
      # (node-forge) are hoisted to the repo root's node_modules.
      - run: npm ci

      - run: npm run -w ua-attestation-verifier test
      - run: npm run -w ua-attestation-verifier build

      - name: Publish
        working-directory: packages/attestation-verifier
        run: npm publish
